name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          release-type: go
          # Use a PAT so the release PR triggers pull_request workflows (CI,
          # lint, benchmark). With the default GITHUB_TOKEN, GitHub blocks
          # workflow runs on bot-created PRs to prevent loops.
          # Create a fine-grained PAT with "contents: write" and
          # "pull-requests: write" scopes, then add it as the
          # RELEASE_PLEASE_TOKEN repository secret.
          # Falls back to GITHUB_TOKEN if the secret is not set (workflows
          # will not run on the release PR in that case).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          # Release Please reads conventional commit prefixes:
          #   feat:  → minor bump
          #   fix:   → patch bump
          #   feat!: → major bump (or "BREAKING CHANGE" in commit body)
