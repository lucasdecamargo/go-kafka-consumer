version: "2"

run:
  timeout: 5m
  build-tags:
    - integration
    - e2ebench

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - misspell
    - gocritic
    - revive
    - unconvert
    - unparam
    - prealloc
    - bodyclose
    - errorlint

  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment

    revive:
      rules:
        - name: exported
          arguments:
            - checkPrivateReceivers
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: error-return
        - name: error-strings
        - name: increment-decrement
        - name: var-naming
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - hugeParam

    misspell:
      locale: US

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - revive
          - gocritic
          - unparam

      - path: benchutil/
        linters:
          - unparam

      - path: examples/
        linters:
          - revive
          - unparam

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
