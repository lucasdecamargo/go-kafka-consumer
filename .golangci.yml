run:
  timeout: 5m
  build-tags:
    - integration
    - e2ebench

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - gosimple
    - ineffassign
    - unused
    - misspell
    - gofmt
    - goimports
    - gocritic
    - revive
    - unconvert
    - unparam
    - prealloc

linters-settings:
  govet:
    enable-all: true
    disable:
      - fieldalignment # Noisy; not worth optimizing unless profiling shows it matters.
  revive:
    rules:
      - name: exported
        arguments:
          - checkPrivateReceivers
      - name: blank-imports
      - name: context-as-argument
      - name: context-keys-type
      - name: error-return
      - name: error-strings
      - name: increment-decrement
      - name: var-naming
      - name: range
      - name: receiver-naming
      - name: time-naming
      - name: unexported-return
      - name: indent-error-flow
      - name: errorf
  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
    disabled-checks:
      - hugeParam # Triggers on types.Message which is passed by value by design.
  misspell:
    locale: US

issues:
  exclude-rules:
    # Test files are allowed to use dot imports and long functions.
    - path: _test\.go
      linters:
        - revive
        - gocritic
        - unparam
    # Benchmark helpers use unused parameters in no-op implementations.
    - path: benchutil/
      linters:
        - unparam
    # Example files prioritize readability over strict lint rules.
    - path: examples/
      linters:
        - revive
        - unparam
  max-issues-per-linter: 0
  max-same-issues: 0
